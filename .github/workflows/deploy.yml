# Deploys to Vercel on every push to main, authenticated by a token instead of
# the GitHub integration - the Vercel account and the GitHub account stay
# unlinked, and no CLI is ever run by a human. The first run creates the Vercel
# project by itself; later runs deploy into it (matched by name within the
# account the token belongs to). Fork PRs never see the secrets (GitHub
# withholds them), so only pushes to this repo's main branch can deploy.
name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Checked here rather than left to the Vercel build, so a failure names
      # itself in the commit that caused it instead of surfacing as a deploy
      # that quietly did not happen. npm run build is typecheck plus bundle.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: npm install --global vercel
      - run: vercel deploy --prod --yes --name=unitree-go2-webui --token=${{ secrets.VERCEL_TOKEN }}
